<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alight Motion Premium — by Shinka</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:#121214;display:flex;justify-content:center;padding:12px}
.wrap{width:100%;max-width:420px}
.card{background:#1e1e20;border:1px solid #2a2a2e;border-radius:24px;padding:18px;margin-bottom:14px;transition:.3s}
.inp{width:100%;background:#27272a;border:1px solid #2a2a2e;border-radius:12px;padding:13px;color:#fff;outline:none;transition:.2s}
.inp:focus{border-color:#3a2a4a}
.inp.error{border-color:#ef4444!important;box-shadow:0 0 0 3px #ef444422;background:#2a1e20!important}
.hint{color:#52525b;font-size:10px;margin-top:6px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7,#c084fc);box-shadow:0 0 15px #7c3aed55}
.tabs{display:flex;gap:6px;background:#121214;border:1px solid #2a2a2e;padding:4px;border-radius:999px;margin:16px 0 10px}
.tab{flex:1;border:0;border-radius:999px;padding:10px;font:700 12px system-ui;cursor:pointer;transition:.2s}
.tab.on{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 0 12px #7c3aed66}
.tab.off{background:transparent;color:#71717a}
.btn{position:relative;z-index:0;width:100%;margin:8px 0;padding:14px 20px;background:#27272a;border:1px solid #2a2a2e;border-radius:12px;color:#e4e4e7;font:800 13px system-ui;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;transition:.15s;overflow:visible}
.btn-row{display:flex;gap:10px}.btn-row .btn{flex:1}
.btn::before{content:"";position:absolute;top:-2px;left:-2px;width:calc(100% + 4px);height:calc(100% + 4px);background:linear-gradient(45deg,#7c3aed,#a855f7,#c084fc,#9333ea,#d8b4fe,#8b5cf6);background-size:600%;filter:blur(7px);z-index:-1;border-radius:14px;opacity:0;transition:.25s;animation:glow 12s linear infinite}
@keyframes glow{0%{background-position:0 0}50%{background-position:400% 0}100%{background-position:0 0}}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn-verif{border-color:#3a2a4a}
.err{margin-top:10px;background:#21151a;border:1px solid #ef4444;border-radius:12px;padding:10px 12px;display:none}
.err b{color:#ef4444;font-size:13px;display:block}.err span{color:#a1a1aa;font-size:11px;display:block;margin-top:3px}
#verifySection{display:none}
#inboxCard{display:none}
/* BLOOD */
.blood-border{border:1px solid #ff000033!important;box-shadow:0 0 0 1px #ff000011,0 0 18px #ff00000f inset!important}
.blood-active{border:1px solid #ff000055!important;box-shadow:0 0 0 1px #ff000022,0 0 28px #ff000015!important}
/* QUOTA BAR 30 ACC GARIS PANJANG */
.quota-wrap{margin:0 0 14px}
.quota-bar-bg{width:100%;height:6px;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:999px;overflow:hidden;position:relative}
.quota-bar-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#ff0000);box-shadow:0 0 10px #ff000066;transition:width .6s cubic-bezier(.4,0,.2,1);width:100%}
.quota-bar-text{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#71717a;font-weight:700;letter-spacing:.5px}
.quota-bar-text b{color:#ff6b6b}
.quota-bar-bg.low .quota-bar-fill{background:#ff0000;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div class="wrap">
<div class="card" id="mainCard">
<div style="display:flex;gap:10px;align-items:center">
<div class="logo">⚡</div>
<div><div style="color:#fff;font:800 18px;padding-left:8px">Alight Motion Premium</div><div style="color:#71717a;font-size:11px;border-left:3px solid #2a2a2e;padding-left:8px;margin-top:4px">Creator: shinka • @iyan.mvz</div></div>
</div>
<div class="tabs">
<button id="b1" class="tab on" onclick="setTab('p')">👤 Private</button>
<button id="b2" class="tab off" onclick="setTab('t')">✎ Tempmail</button>
</div>
<div id="quotaWrap" class="quota-wrap" style="display:none">
<div id="quotaBarBg" class="quota-bar-bg"><div id="quotaBar" class="quota-bar-fill"></div></div>
<div class="quota-bar-text"></span><b id="quotaText">30/30 acc</b></div>
</div>
<div style="color:#e4e4e7;font:700 12px system-ui;margin:12px 0 6px">📦 Your email</div>
<input id="email" class="inp" placeholder="contoh: user@mail.com" oninput="clearErr('email')">
<div id="errEmail" class="err"><b>❌ Error atau gagal</b><span id="errEmailSub">Masukan email anda</span></div>
<div id="tempBtns" class="btn-row" style="display:none;margin-top:10px">
<button class="btn" onclick="generate()">✎ Buat mail</button>
<button class="btn" onclick="loadInbox()">↻ Refresh</button>
</div>
<button id="btnKirim" class="btn" style="margin-top:12px" onclick="kirim()">✈ Kirim Magic Link</button>
<div id="status"></div>
<div id="verifySection">
<div style="color:#e4e4e7;font:700 12px system-ui;margin:14px 0 6px">🔗 Masukkan Magic Link</div>
<input id="vlink" class="inp" placeholder="https://alight-creative.firebase..." oninput="clearErr('vlink')">
<div id="errLink" class="err"><b>❌ Error atau gagal</b><span id="errLinkSub">Masukan magic link anda</span></div>
<button id="btnVerif" class="btn btn-verif" onclick="verif()">Verifikasi & Aktivasi</button>
<div class="hint">ⓘ Link otomatis terdeteksi dari inbox temp mail.</div>
</div>
</div>
<div id="inboxCard" class="card">
<div style="color:#fff;font:700 12px system-ui">📥 Inbox Temp Mail <span id="eLabel" style="background:#27272a;border:1px solid #2a2a2e;padding:3px 8px;border-radius:999px;font-size:10px;color:#71717a;margin-left:6px"></span></div>
<div class="btn-row" style="margin-top:10px"><button class="btn" onclick="loadInbox()">↻ Refresh</button><button class="btn" onclick="generate()">+ Generate Baru</button></div>
<div id="inbox" style="margin-top:10px;background:#27272a;border:1px solid #2a2a2e;border-radius:12px;padding:20px;text-align:center;color:#52525b;font-size:12px">Belum ada email masuk.</div>
</div>
</div>
<script>
let cur='',sent=false
function setTab(m){
 document.getElementById('b1').className=m=='p'?'tab on':'tab off'
 document.getElementById('b2').className=m=='t'?'tab on':'tab off'
 document.getElementById('tempBtns').style.display=m=='t'?'flex':'none'
 let inbox=document.getElementById('inboxCard')
 let quota=document.getElementById('quotaWrap')
 let emailInp=document.getElementById('email')
 inbox.style.display=m=='t'?'block':'none'
 quota.style.display=m=='t'?'block':'none'
 if(m=='t'){ inbox.classList.add('blood-active'); emailInp.classList.add('blood-border'); updateQuota(); }
 else { inbox.classList.remove('blood-active'); emailInp.classList.remove('blood-border'); }
 document.getElementById('verifySection').style.display=(m=='t'||sent)?'block':'none'
 if(m=='t'&&!cur) generate()
}
function clearErr(t){
 if(t=='email'){document.getElementById('email').classList.remove('error');document.getElementById('errEmail').style.display='none'}
 if(t=='vlink'){document.getElementById('vlink').classList.remove('error');document.getElementById('errLink').style.display='none'}
}
function showErrEmail(msg){
 document.getElementById('email').classList.add('error')
 document.getElementById('errEmailSub').innerText=msg
 document.getElementById('errEmail').style.display='block'
}
function showErrLink(msg){
 document.getElementById('vlink').classList.add('error')
 document.getElementById('errLinkSub').innerText=msg
 document.getElementById('errLink').style.display='block'
}
async function updateQuota(){
 try{
  let s=await fetch('/api/stats').then(r=>r.json())
  let left = s.tempmailLeft ?? 30
  let percent = (left/30)*100
  document.getElementById('quotaBar').style.width = percent + '%'
  document.getElementById('quotaText').innerText = left + '/30 acc'
  let bg=document.getElementById('quotaBarBg')
  if(left<=5) bg.classList.add('low'); else bg.classList.remove('low')
  if(left<=0) showErrEmail('Limit 30/hari tempmail habis, reset 00:00 WIB')
 }catch{}
}
async function generate(){
 document.getElementById('email').value='Generating...'
 clearErr('email')
 try{
  let r=await fetch('/api/tempmail/create',{method:'POST'}).then(r=>r.json())
  if(r.error) throw new Error(r.error)
  cur=r.email||r.data?.email
  if(!cur) throw 0
  document.getElementById('email').value=cur
  document.getElementById('eLabel').innerText=cur
  updateQuota()
  loadInbox()
 }catch(e){
  document.getElementById('email').value=''
  showErrEmail(e.message||'Email yg anda masukan tidak terdeteksi')
 }
}
async function kirim(){
 const email=document.getElementById('email').value.trim()
 if(!email){showErrEmail('Masukan email anda');return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErrEmail('Email yg anda masukan tidak terdeteksi');return}
 const btn=document.getElementById('btnKirim')
 btn.innerText='⏳ Mengirim...';btn.disabled=true
 clearErr('email')
 try{
  let res=await fetch('/api/send-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}).then(r=>r.json())
  if(res.error||res.success===false) throw 0
  sent=true
  document.getElementById('verifySection').style.display='block'
  document.getElementById('status').innerHTML=`<div style="margin-top:10px;background:#172117;border:1px solid #2a3a2a;border-radius:12px;padding:10px;color:#4ade80;font-size:12px">✅ Magic link dikirim ke ${email}</div>`
 }catch{
  showErrEmail('Email yg anda masukan tidak terdeteksi')
 }finally{btn.innerText='✈ Kirim Magic Link';btn.disabled=false}
}
async function verif(){
 const link=document.getElementById('vlink').value.trim()
 if(!link){showErrLink('Masukan magic link anda');return}
 if(!link.includes('https://')){showErrLink('Dikarenakan magic link eror atau kadaluarsa');return}
 const btn=document.getElementById('btnVerif')
 btn.innerText='⏳ Memverifikasi...';btn.disabled=true
 clearErr('vlink')
 try{
  let res=await fetch('/api/verify-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link,email:document.getElementById('email').value})}).then(r=>r.json())
  if(res.error||res.success===false) throw 0
  document.getElementById('status').innerHTML+=`<div style="margin-top:8px;background:#1a2a1e;border:1px solid #23412b;border-radius:12px;padding:10px;color:#4ade80;font-size:12px">✅ ${res.message||'Aktivasi berhasil!'}</div>`
 }catch{
  showErrLink('Dikarenakan magic link eror atau kadaluarsa')
 }finally{btn.innerText='✔ Verifikasi & Aktivasi';btn.disabled=false}
}
async function loadInbox(){
 if(!cur) return
 try{
  let d=await fetch('/api/tempmail/inbox?email='+encodeURIComponent(cur)).then(r=>r.json())
  let mails=d.mails||d.data||d.result||[]
  let box=document.getElementById('inbox')
  if(!mails.length){box.innerHTML='Belum ada email masuk.';box.style.textAlign='center';return}
  box.innerHTML='';box.style.textAlign='left'
  mails.forEach(m=>{
   let txt=(m.html||m.text||m.body||'').toString()
   let link=(txt.match(/https:\/\/alight-creative\.firebaseapp\.com[^\s"'<>]+/i)||[])[0]
   let el=document.createElement('div')
   el.style.cssText='background:#1e1e20;border:1px solid #2a2a2e;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer'
   el.innerHTML=`<b style="color:#fff;font-size:12px">${m.subject||'Alight Creative'}</b><br><small style="color:#71717a">${m.from||m.sender||''}</small>`
   el.onclick=()=>{if(link){document.getElementById('vlink').value=link;clearErr('vlink');document.getElementById('verifySection').style.display='block'}}
   box.appendChild(el)
  })
 }catch{}
}
setTab('p')
</script>
</body>
</html>
